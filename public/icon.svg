<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)" />
  <!-- Wallet shape -->
  <g filter="url(#shadow)" transform="translate(86, 120)">
    <rect x="0" y="40" width="340" height="230" rx="36" fill="#ffffff" />
    <path d="M 0 76 Q 0 40 36 40 L 304 40 Q 340 40 340 76 L 340 90 L 0 90 Z" fill="#e0e7ff" />
    <!-- Wallet flap -->
    <path d="M 210 115 L 340 115 L 340 195 L 210 195 Q 170 155 210 115 Z" fill="#4f46e5" />
    <circle cx="250" cy="155" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
    <!-- Camera lens badge -->
    <g transform="translate(50, 110)">
      <rect x="0" y="10" width="90" height="70" rx="18" fill="url(#accentGrad)" />
      <path d="M 28 10 L 38 0 L 52 0 L 62 10 Z" fill="url(#accentGrad)" />
      <circle cx="45" cy="45" r="20" fill="#ffffff" opacity="0.9" />
      <circle cx="45" cy="45" r="12" fill="#047857" />
      <circle cx="51" cy="39" r="4" fill="#ffffff" />
    </g>
  </g>
  <!-- Currency symbol badge -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SỔ THU CHI</text>
</svg>
